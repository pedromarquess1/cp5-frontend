<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melodia | Contato</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class"
        }
    </script>
</head>

<body class="bg-[#F5F7F2] text-[#1F2A22] antialiased dark:bg-[#070807] dark:text-[#EDF7F1]">
    <div class="mx-auto max-w-7xl px-4 py-6 lg:px-6">
        <div class="grid gap-6 lg:grid-cols-[220px_minmax(0,1fr)]">
            <aside class="lg:sticky lg:top-6 lg:self-start">
                <div
                    class="rounded-2xl border border-[#E5EAE3] bg-white p-4 shadow-sm dark:border-[#1D2F27] dark:bg-[#0F1A13]">
                    <div class="mb-6 flex items-center gap-3">
                        <div
                            class="flex h-10 w-10 items-center justify-center rounded-xl bg-[#5FAE78] text-lg font-bold text-white">
                            M</div>
                        <div>
                            <p class="text-[10px] uppercase tracking-[0.2em] text-[#647167] dark:text-[#D7F3DC]">Portal
                            </p>
                            <h2 class="text-lg font-semibold text-[#1D2B23] dark:text-white">Melodia</h2>
                        </div>
                    </div>

                    <nav class="space-y-2">
                        <a href="index.html#features"
                            class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-[#33463A] transition hover:bg-[#EAF7EE] dark:text-[#E9F5EE] dark:hover:bg-[#17352C]">
                            <span
                                class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#E3F5E9] text-[#2E7B5A] dark:bg-[#1D3A2E] dark:text-[#DDFBEF]"><i
                                    class="fa-solid fa-music"></i></span>
                            Funcionalidades
                        </a>
                        <a href="index.html#music"
                            class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-[#33463A] transition hover:bg-[#EAF7EE] dark:text-[#E9F5EE] dark:hover:bg-[#17352C]">
                            <span
                                class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#E3F5E9] text-[#2E7B5A] dark:bg-[#1D3A2E] dark:text-[#DDFBEF]"><i
                                    class="fa-solid fa-compact-disc"></i></span>
                            Músicas
                        </a>
                        <a href="contact.html"
                            class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-[#33463A] transition hover:bg-[#EAF7EE] dark:text-[#E9F5EE] dark:hover:bg-[#17352C]">
                            <span
                                class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#E3F5E9] text-[#2E7B5A] dark:bg-[#1D3A2E] dark:text-[#DDFBEF]"><i
                                    class="fa-solid fa-envelope"></i></span>
                            Contato
                        </a>
                    </nav>
                </div>
            </aside>

            <main>
                <header
                    class="mb-8 flex items-center justify-between rounded-2xl border border-[#E5EAE3] bg-white px-4 py-3 shadow-sm dark:border-[#1D2F27] dark:bg-[#0F1A13]">
                    <div>
                        <p class="text-xs uppercase tracking-[0.2em] text-[#647167] dark:text-[#D7F3DC]">Converse</p>
                        <h1 class="mt-1 text-xl font-semibold text-[#1D2B23] dark:text-white">Contato</h1>
                    </div>

                    <button id="theme-toggle" type="button" aria-label="Alternar tema"
                        class="flex h-10 w-10 items-center justify-center rounded-full border border-[#E5EAE3] bg-[#F7F2EE] text-[#3B2E2D] hover:bg-[#F1E2D9] dark:border-[#2B3F36] dark:bg-[#1A2F27] dark:text-[#F5C98D] dark:hover:bg-[#233F35]">
                        <i class="fa-solid fa-moon block dark:hidden"></i>
                        <i class="fa-solid fa-sun hidden dark:block"></i>
                    </button>
                </header>

                <section
                    class="rounded-3xl border border-[#E5EAE3] bg-white p-6 shadow-sm dark:border-[#1D2F27] dark:bg-[#0F1A13]">
                    <p
                        class="mb-3 text-[10px] font-semibold uppercase tracking-[0.26em] text-[#2F7E58] dark:text-[#9AD9B4]">
                        Fale conosco</p>
                    <h2 class="text-3xl font-semibold text-[#1D2B23] dark:text-white">Vamos conversar sobre a sua
                        próxima trilha.</h2>
                    <p class="mt-3 max-w-xl text-sm leading-6 text-[#495D52] dark:text-[#E4F4EA]">Envie sua mensagem e
                        retornaremos com a resposta mais breve possível.</p>

                    <form
                        class="mt-8 rounded-2xl border border-[#E5EAE3] bg-[#F9F3EE] p-5 dark:border-[#1D2F27] dark:bg-[#0B1511]"
                        onsubmit="event.preventDefault(); alert('Mensagem enviada com sucesso!')">
                        <div class="grid gap-4 md:grid-cols-2">
                            <label class="block text-sm font-medium text-[#2F413A] dark:text-[#F0F7F1]">
                                Nome
                                <input type="text" required
                                    class="mt-2 w-full rounded-xl border border-[#E5EAE3] bg-white px-3 py-2.5 text-[#2F413A] placeholder:text-[#8A9A8F] focus:border-[#5FAE78] focus:outline-none dark:border-[#2B3F36] dark:bg-[#11251E] dark:text-white dark:placeholder:text-[#94A99B]"
                                    placeholder="Seu nome" />
                            </label>

                            <label class="block text-sm font-medium text-[#2F413A] dark:text-[#F0F7F1]">
                                E-mail
                                <input type="email" required
                                    class="mt-2 w-full rounded-xl border border-[#E5EAE3] bg-white px-3 py-2.5 text-[#2F413A] placeholder:text-[#8A9A8F] focus:border-[#5FAE78] focus:outline-none dark:border-[#2B3F36] dark:bg-[#11251E] dark:text-white dark:placeholder:text-[#94A99B]"
                                    placeholder="seu@email.com" />
                            </label>
                        </div>

                        <label class="mt-4 block text-sm font-medium text-[#2F413A] dark:text-[#F0F7F1]">
                            Mensagem
                            <textarea required rows="5"
                                class="mt-2 w-full rounded-xl border border-[#E5EAE3] bg-white px-3 py-2.5 text-[#2F413A] placeholder:text-[#8A9A8F] focus:border-[#5FAE78] focus:outline-none dark:border-[#2B3F36] dark:bg-[#11251E] dark:text-white dark:placeholder:text-[#94A99B]"
                                placeholder="Escreva sua mensagem"></textarea>
                        </label>

                        <div class="mt-6 flex items-center justify-between gap-3">
                            <span class="text-xs text-[#67766B] dark:text-[#D9E9E0]">Resposta em até 24 horas.</span>
                            <button type="submit"
                                class="rounded-xl bg-[#5FAE78] px-5 py-2.5 text-sm font-medium text-white hover:bg-[#4D9C66]">Enviar</button>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
